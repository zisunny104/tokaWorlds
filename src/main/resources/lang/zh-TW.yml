  homeSaveFailed: "住家儲存失敗"
  homesChanged: "住家資料已變更，停止更名"
  homesModified: "住家資料被其他工作修改，需人工還原"

# ---------------------------------------------------------------------------
# ui.<表單>.<名>：表單標題、按鈕、欄位（表單內不加顏色）
# ---------------------------------------------------------------------------
ui:
  menu:
    title: "世界管理"
    rename: "新增世界更名"
    mount: "新增掛載／卸載"
    check: "檢查全部並排程"
    clear: "清空待辦"
    list: "列出世界"
    close: "關閉"
  add:
    world: "選擇世界 A"
    newName: "新名稱 B"
    link: "連動 zero／tokaPortal 世界引用"
    action: "操作"
    mount: "掛載"
    unmount: "卸載"
  confirm:
    title: "排程確認"
    delay: "延遲秒數（0～3600）"
    placeholder: "例如 30"
    toggle: "確認上述全部項目並執行"

# ---------------------------------------------------------------------------
# log.<名>：後台文字（不加方括號標籤；文字 §b、數字 §a、警告 §e、錯誤 §c）
# ---------------------------------------------------------------------------
log:
  # ${0}=世界數
  loadedWorlds: "§b載入世界共 §a${0} §b個"
  # ${0}=未完成的工作代號
  recoveryPending: "§c有未完成的世界工作，停止修改：§a${0}"
  # ${0}=世界名稱 ${1}=失敗原因
  mountFailed: "§e掛載失敗 §a${0}§e：${1}"
  unmountFailed: "§e卸載失敗 §a${0}§e：${1}"
  initFailed: "§c世界管理初始化失敗"
  journalLost: "§c工作紀錄無法保存，停止自動還原，需停服核對世界與引用備份。"
  # ${0}=未完成的工作代號
  rollbackFailed: "§c自動還原未完成，停止所有世界修改：§a${0}"
  jobFailed: "§c世界工作失敗"
  returnSaveFailed: "§c返回紀錄儲存失敗"
  closeFailed: "§c關閉儲存失敗"
  legacy:
    # ${0}=規則數 ${1}=舊編號清單
    rulesLoaded: "§b載入舊編號物品轉換規則共 §a${0} §b個（編號 §a${1}§b）"
    # ${0}=設定的編號 ${1}=失敗原因
    ruleUnreadable: "§elegacy-items 的 §a${0} §e設定無法讀取，已略過：${1}"
    # ${0}=玩家名稱 ${1}=失敗原因
    convertFailed: "§e轉換 §a${0} §e的舊編號物品失敗：${1}"
    # ${0}=目標物品 ${1}=舊編號
    itemNotFound: "§elegacy-items：找不到物品 §a${0}§e，沒有轉換 §a${1}"
    # ${0}=玩家名稱 ${1}=轉換紀錄
    item: "§b舊編號物品 §a${0}§b：${1}"
    # ${0}=檔案失敗原因
    fileWriteFailed: "§e無法寫入 legacy-items.log：${0}"
    # 寫進 legacy-items.log 的紀錄（純文字，不加顏色）。${0}=物品名稱 ${1}=數量
    dropped: "背包已滿，掉落 ${0} x${1}"

# ---------------------------------------------------------------------------
# status.<名>：狀態字
# ---------------------------------------------------------------------------
status:
  op:
    mount: "掛載"
    unmount: "卸載"
    rename: "更名"
  link:
    "on": "［連動開啟］"
    "off": "［不連動］"
    # 更名連動的說明，會寫進操作紀錄。${0}=筆數
    zero: "zero：${0} 筆區域／領地／傳送點／告示牌／方塊紀錄"
    # ${0}=住家數
    portal: "tokaPortal：${0} 個住家"
  # 舊編號物品被移除（寫進 legacy-items.log，純文字）
  legacyRemoved: "移除"

# ---------------------------------------------------------------------------
# cli.<名>：離線工具 StorageCli 的輸出（純文字，不加色碼；PASS 標記行維持英文代碼）
# ---------------------------------------------------------------------------
cli:
  usage: "先完整停服。import-legacy <舊插件資料夾> <sqlite|json|yaml> <新儲存資料夾> <備份資料夾>；migrate <來源格式> <來源儲存資料夾> <目標格式> <新儲存資料夾> <備份資料夾>；inspect <格式> <儲存資料夾>"
  importArgs: "import-legacy 需要來源、格式、新目的地與備份資料夾"
  sourceNotPlain: "來源必須是一般插件資料夾"
  targetInside: "目的地必須在來源資料夾外，驗證後才人工移入 storage"
  backupInside: "備份必須在來源與目的地外"
  backupVerify: "來源備份驗證失敗"
  importVerify: "匯入讀回驗證失敗"
  sourceChanged: "來源資料在匯入期間改變，停止啟用目的地"
  migrateArgs: "migrate 需要來源格式／路徑、目標格式／新路徑、備份資料夾"
  inspectArgs: "inspect 需要格式與路徑"
  unknown: "未知離線指令"
  # ${0}=檔案路徑
  noStoreFile: "來源儲存檔案不存在或為連結：${0}"
  noConfig: "缺少一般 config.yml 來源"
  badConfig: "無效 config.yml"
  # ${0}=設定 key
  badList: "無效設定列表：${0}"
  refuseSource: "拒絕來源連結"
  # ${0}=檔案路徑
  refuseFile: "拒絕非一般來源檔案：${0}"
