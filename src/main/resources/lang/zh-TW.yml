  show: "§c${0}"
  # 一般錯誤
  legacyDataFound: "偵測到舊資料，需停服執行 StorageCli import-legacy 匯入。"
  otherFormat: "其他儲存格式已有資料，需先離線 migrate。"
  legacyNotImported: "新儲存未含舊資料，需先離線匯入。"
  otherFormatEmpty: "其他格式已有資料但目前格式為空，停止初始化，需離線遷移。"
  storageNotReady: "儲存未就緒，停止世界管理"
  busy: "已有世界工作排程／執行中"
  # ${0}=未完成的工作代號
  recoveryFirst: "未完成工作需先人工檢查：${0}"
  storageFailed: "儲存已失效，停止世界修改"
  storageNotReadyMount: "儲存未就緒，停止掛載"
  storageNotReadyUnmount: "儲存未就緒，停止卸載"
  # ${0}=世界名稱
  coreMountFailed: "核心未能掛載：${0}"
  needOtherWorld: "需要另一張已載入世界供玩家移出"
  defaultWorldNoUnmount: "預設世界不能卸載／更名，需先在 server.properties 換預設世界。"
  # ${0}=玩家名稱
  playerCannotMove: "玩家無法移出：${0}"
  worldStillHasPlayers: "世界仍有玩家，停止工作"
  # ${0}=世界名稱
  worldSaveFailed: "世界儲存失敗：${0}"
  # ${0}=世界名稱
  unloadRefused: "卸載被核心或其他插件拒絕：${0}"
  planEmpty: "待辦列表是空的"
  # ${0}=世界名稱
  duplicateWorld: "同一世界不可重複排入列表：${0}"
  unknownOp: "未知操作"
  # ${0}=世界名稱
  defaultWorldNamed: "預設世界不能卸載／更名：${0}"
  # ${0}=新名稱
  targetDuplicate: "目標名稱重複或串接更名：${0}"
  evacuationConflict: "移出玩家用的世界不能同時排入卸載／更名"
  renameLoadFailed: "更名後世界無法載入"
  alreadyStarted: "工作已開始，無法中途取消"
  notChecked: "尚未檢查，需先執行 /worlds check"
  delayRange: "延遲秒數範圍為 0～3600"
  permissionRemoved: "執行權限已移除"
  # ${0}=玩家名稱
  returnPending: "玩家還有未完成的返回紀錄：${0}"
  # ${0}=玩家名稱
  playerNotMoved: "玩家未能移出：${0}"
  noWorlds: "沒有可管理的世界"
  playerOnly: "只能在遊戲內使用"
  unknownLink: "未知連動選項"
  # 世界名稱是指令關鍵字。${0}=輸入的名稱 ${1}、${2}=建議的名稱
  reservedName: "「§a${0}§c」是保留字（/tpw 等指令的關鍵字），可改用 §a${1}§c 或 §a${2}"
  usage:
    # ${0}=子指令（mount 或 unmount）
    mount: "用法：/worlds ${0} 世界名稱"
    rename: "用法：/worlds rename A B [--link|--no-link]"
    confirm: "用法：/worlds confirm [延遲秒數]"
  # 世界資料夾與名稱檢查
  worldName: "世界名稱只能包含文字、數字、底線與連字號（1～64 字）。"
  pathUnsafe: "世界路徑不安全"
  # ${0}=世界名稱 ${1}=可用世界名稱（以、分隔）
  worldNotFound: "找不到完整世界：${0}；可用世界：${1}"
  symlink: "不接受世界資料的符號連結"
  # ${0}=世界名稱
  targetExists: "目的世界已存在，未覆蓋：${0}"
