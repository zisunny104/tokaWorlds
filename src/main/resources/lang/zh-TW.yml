  # ${0}=玩家名稱
  playerNotMoved: "玩家未能移出：${0}"
  noWorlds: "沒有可管理的世界"
  playerOnly: "只能在遊戲內使用"
  resendRunning: "你已有進行中的重送，請等它完成"
  unknownLink: "未知連動選項"
  # 世界名稱是指令關鍵字。${0}=輸入的名稱 ${1}、${2}=建議的名稱
