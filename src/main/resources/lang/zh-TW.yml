# tokaWorlds 繁體中文語系檔（zh-TW）
# 所有使用者看得到的文字都在這裡；程式內不寫中文。檔案必須是 UTF-8。
# 參數用 ${0}、${1} 表示（依序由 0 開始），每個 key 上方的註解會說明各參數的意義與順序。
# 顏色慣例：一般文字 §b、數字／名稱／值 §a、警告 §e、成功 §a、錯誤 §c、次要說明 §7、標題 §6。
# 後台 log 不加方括號標籤，行首直接寫文字。
# 伺服器擁有者可以把同名檔放進 plugins/tokaWorlds/lang/ 覆蓋個別文字。

# ---------------------------------------------------------------------------
# cmd.<指令>.desc / cmd.<指令>.usage：指令說明與用法
# ---------------------------------------------------------------------------
cmd:
  worlds:
    # 用法，未知子指令時顯示；無參數
    usage:
      - "§e/worlds list §7| §e/worlds mount §aA §7| §e/worlds unmount §aA §7| §e/worlds rename §aA B §7[--link|--no-link]"
      - "§7| §e/worlds plan §7| §e/worlds check §7| §e/worlds confirm §7[秒] | §e/worlds clear §7| §e/worlds cancel §7| §e/worlds resend §7[半徑]"
      - "§7輸入 §e/worlds help §7查看完整說明；遊戲內輸入 §e/worlds §7可開啟管理視窗。"

# ---------------------------------------------------------------------------
# help.<指令>：/指令 help 的多行說明（第一行標題）
# ---------------------------------------------------------------------------
help:
  worlds:
    - "§6=== §f§l世界管理 說明§r §6==="
    - "§e/worlds §7- §b遊戲內開啟管理視窗（主控台顯示本說明）"
    - "§e/worlds list §7- §b列出世界與掛載狀態、線上玩家數"
    - "§e/worlds mount <世界> §7- §b把世界加入待辦：掛載"
    - "§e/worlds unmount <世界> §7- §b把世界加入待辦：卸載（不刪除地圖）"
    - "§e/worlds rename <A> <B> [--link|--no-link] §7- §b把世界更名加入待辦；--link 連動 zero／tokaPortal，--no-link 只改地圖"
    - "§e/worlds plan §7- §b查看自己的待辦列表"
    - "§e/worlds check §7- §b檢查全部待辦（排程前必檢查）"
    - "§e/worlds confirm [延遲秒數] §7- §b排程執行，延遲 0～3600 秒，預設 0"
    - "§e/worlds clear §7- §b清空自己的待辦"
    - "§e/worlds cancel §7- §b工作開始前取消排程，待辦保留"
    - "§e/worlds resend [半徑] §7- §b把周圍的樓梯、柵欄、玻璃片、牆、門與柵欄門重新送給自己（半徑 1～48，預設 16；只影響自己的畫面）"
    - "§e/worlds return §7- §b維護後尚未返回時，手動回到原位置（玩家可用）"
    - "§e/worlds help §7- §b顯示本說明"

# ---------------------------------------------------------------------------
# msg.<區>.<名>：玩家（或指令執行者）看到的訊息
# ---------------------------------------------------------------------------
msg:
  plan:
    # 待辦列表的一般項目（掛載／卸載）。${0}=序號 ${1}=操作名稱（見 status.op.*）${2}=世界名稱 ${3}=線上玩家數
    item: "§a${0}§b. §a${1} ${2}§b；線上玩家 §a${3}"
    # 待辦列表的更名項目。${0}=序號 ${1}=操作名稱 ${2}=來源世界 ${3}=新名稱 ${4}=連動標記（status.link.*）${5}=線上玩家數
    rename: "§a${0}§b. §a${1} ${2}§b → §a${3}§b ${4}§b；線上玩家 §a${5}"
    # 待辦列表結尾說明（多行；無參數）
    footer:
      - "§b更名時玩家先移到其他世界，完成後返回原座標；失敗即停止，已完成項目保留。"
      - "§b連動範圍：zero 世界欄位、tokaPortal 2.0.0 住家。"
      - "§b目的資料夾已存在時不覆蓋。"
  # 已加入待辦；無參數
  added: "§a已加入待辦"
  # 待辦已清空；無參數
  cleared: "§a待辦已清空"
  # 檢查通過；無參數
  checkPass: "§a檢查通過"
  # 排程已取消；無參數
  cancelled: "§a排程已取消，待辦保留。"
  # 已排程。${0}=項目數 ${1}=延遲秒數
  scheduled: "§b已排程 §a${0} §b項，§a${1} §b秒後執行。"
  # 全部完成；無參數
  allDone: "§a世界工作全部完成。"
  # 工作中途停止。${0}=錯誤原因
  stopped: "§c工作停止：${0}"
  list:
    # 未掛載的世界。${0}=世界名稱
    unmounted: "§a${0}§b：未掛載"
    # 掛載中的世界。${0}=世界名稱 ${1}=線上玩家數
    mounted: "§a${0}§b：掛載中，玩家 §a${1}"
  # 周圍方塊已重新送出。${0}=半徑 ${1}=方塊數
  resend: "§a已重新送出周圍 §b${0} §a格內的樓梯、柵欄、玻璃片、牆、門與柵欄門，共 §b${1} §a個方塊，只影響你自己的畫面"
  maintenance:
    # 維護開始，玩家被移出並凍結；無參數
    start: "§e世界維護開始，完成後自動返回。"
    # 維護期間輸入指令被擋；無參數
    busy: "§e世界維護中。"
  return:
    # 原世界尚未恢復；無參數
    notRestored: "§e原世界尚未恢復，掛載後可用 §a/worlds return§e 返回。"
    # 已返回；無參數
    done: "§a世界維護完成，已返回原位置。"
    # 返回傳送被拒絕；無參數
    rejected: "§e返回傳送被拒絕，可用 §a/worlds return§e 再試。"
  legacy:
    # 玩家上線時背包的舊編號物品已被換成現在的物品；無參數
    converted: "§e背包內的舊版物品已換成現行版本。"

# ---------------------------------------------------------------------------
# err.<名>：錯誤／拒絕。這些文字會被包進 err.show 顯示給玩家，所以本身不加顏色
