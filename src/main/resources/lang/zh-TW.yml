  # ${0}=未完成的工作代號
  rollbackFailed: "§c自動還原未完成，停止所有世界修改：§a${0}"
  jobFailed: "§c世界工作失敗"
  returnSaveFailed: "§c返回紀錄儲存失敗"
  closeFailed: "§c關閉儲存失敗"
  legacy:
    # ${0}=規則數 ${1}=舊編號清單
    rulesLoaded: "§b載入舊編號物品轉換規則共 §a${0} §b個（編號 §a${1}§b）"
    # ${0}=設定的編號 ${1}=失敗原因
    ruleUnreadable: "§elegacy-items 的 §a${0} §e設定無法讀取，已略過：${1}"
