  sourceNotPlain: "來源必須是一般插件資料夾"
  targetInside: "目的地必須在來源資料夾外，驗證後才人工移入 storage"
  backupInside: "備份必須在來源與目的地外"
  backupVerify: "來源備份驗證失敗"
