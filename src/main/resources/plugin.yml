name: tokaWorlds
main: dev.toka.worlds.Main
version: "1.3.1"
api: ["1.0.4"]
load: POSTWORLD
softdepend: [tokaPortal, tokaLand]
commands:
  world:
    aliases: [worlds]
    description: 世界掛載與批次更名管理
    usage: "/world help 查看說明"
    permission: tokaWorlds.use
permissions:
  tokaWorlds.use:
    default: true
  tokaWorlds.admin:
    default: op
