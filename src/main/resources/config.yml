# 世界更名預設連動 zero 的已知世界欄位與 tokaPortal 2.0.0 住家。
link-on-rename: true
# 正式資料預設 SQLite；只更改格式不會自動遷移，必須完整停服使用離線 CLI。
storage:
  backend: sqlite
# 必須是另一張已載入的世界；空白時使用預設世界。
evacuation-world: ""

# 舊核心留下、現在的核心已不認得的物品編號（日誌會出現 Unknown legacy2Runtime mapping）。
# 玩家上線時，背包裡這些編號會換成 to 指定的物品，數量乘以 per-item；to 留空或寫 remove 代表直接移除。
# 每次轉換都會記在 plugins/tokaWorlds/legacy-items.log，可以依紀錄手動還原。
legacy-items:
  903:                      # 原本是 petrified_oak_double_slab（石化橡木雙層半磚）
    to: "minecraft:petrified_oak_slab"
    per-item: 2
  879:                      # 原本是 cobblestone_double_slab（圓石雙層半磚）
    to: "minecraft:cobblestone_slab"
    per-item: 2
